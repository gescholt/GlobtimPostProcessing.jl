[deps]
ADTypes = "47edcb42-4c32-4615-8424-f2b9edc5f35b"
AbstractTrees = "1520ce14-60c1-5f80-bbc7-55ef81b5835c"
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
FiniteDiff = "6a86dc24-6348-571c-b903-95158fe2bd41"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
LineSearches = "d3d80556-e9d4-5f37-9878-2ab0fcc64255"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
Optim = "429524aa-4258-5aef-a3af-852621145aeb"
PrettyTables = "08abe8d2-0d0c-5749-adfa-8a2ac140af0d"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
ProgressMeter = "92933f4c-e287-5a05-a399-4b506db050ca"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
REPL = "3fa0cd96-eef1-5676-8a61-b3b8758bbffb"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
StatsBase = "2913bbd2-ae8a-5f71-8c99-4fb6c76f3a91"
UnicodePlots = "b8865327-cd53-5732-bb35-84acbb429228"

[weakdeps]
Globtim = "00da9514-6261-47e9-8848-33640cb1e528"

[extensions]
GlobtimExt = "Globtim"

[compat]
AbstractTrees = "0.3, 0.4"
# CSV 1 is not installable here: it requires Parsers 3, and JSON3 (capped at
# 1.14.3) requires Parsers <= 2.8.8, so forcing CSV 1 is unsatisfiable. The
# CompatHelper "0.10, 1" widen would be a no-op today and an untested upgrade
# the day JSON3 gains Parsers 3. Revisit then. (Checked 2026-09-16.)
CSV = "0.10"
# ADTypes names the AD backend handed to Optim (`AutoForwardDiff()`); Optim 2
# defaults to central finite differences when none is given (bead hdgw.1).
ADTypes = "1"
DataFrames = "1.6"
Dates = "1"
FiniteDiff = "2"
ForwardDiff = "0.10, 1"
Globtim = "1"
JLD2 = "0.5, 0.6"
JSON = "0.21, 1"
JSON3 = "1.14"
LineSearches = "7"
LinearAlgebra = "1"
Logging = "1"
Optim = "1.12, 2"
# PrettyTables 3 dropped Highlighter, tf_unicode_rounded, ft_printf and the
# header_crayon kwarg (verified against 3.4.8). display_helpers.jl and the dozen
# pretty_table call sites in experiment_display.jl use all four, so the widen
# stays refused until that display layer is ported. It was tried once and
# reverted: green locally on a manifest pinned to 2.x, red on a fresh CI resolve.
# Consequence worth knowing before chasing it (measured 2026-09-17): this cap is
# also what holds HomotopyContinuation at 2.17.1. HC 2.22.4 requires
# PrettyTables 3.1.0 - 3.4.8, so 2.17.1 is the highest HC the resolver can pick
# while any workspace member asks for PrettyTables 2 (here, DynamicObjectives,
# IsingControlN, GlobTimRL, Opt_Traj). `Pkg.status --outdated` marks HC with ⌃
# ("may be upgradable"), which is misleading — it is blocked, not lagging.
PrettyTables = "2"
Printf = "1"
Random = "1"
ProgressMeter = "1.10"
REPL = "1"
Statistics = "1"
StatsBase = "0.34"
UnicodePlots = "3"
julia = "1.12"
